name = "footnote-feeds-edge"
main = "src/index.ts"
compatibility_date = "2024-04-05"
node_compat = true

[vars]
BACKEND_URL = "https://api.footnote.dev"
# Must match EDGE_SERVICE_TOKEN on the API (openssl rand -hex 32); do not commit real values.
SERVICE_TOKEN = ""

[[kv_namespaces]]
binding = "API_KEYS"
id = "mock_kv_id"
preview_id = "mock_kv_preview_id"
